<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#183B56"/></marker>
<marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2F6BFF"/></marker>
<marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2FA36B"/></marker>
<linearGradient id="bluegrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EAF1FF"/><stop offset="1" stop-color="#D9E8FF"/></linearGradient>
<linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#EDF2F7"/><stop offset="0.35" stop-color="#A9D7D0"/><stop offset="0.7" stop-color="#42A88F"/><stop offset="1" stop-color="#136C64"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="white"/>
<text x="800.0" y="54" fill="#183B56" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" font-style="normal" text-anchor="middle">二维目标位移命令及坐标定义</text>
<rect x="45" y="100" width="960" height="720" rx="22" fill="#FCFDFE" fill-opacity="1.0" stroke="#DDE3EA" stroke-width="2"/>
<line x1="350" y1="620" x2="780" y2="620" stroke="#607080" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="350" y1="620" x2="350" y2="230" stroke="#607080" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="800" y="630" fill="#607080" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" font-style="normal" text-anchor="start">世界坐标 Xᴡ</text>
<text x="335" y="205" fill="#607080" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" font-style="normal" text-anchor="end">世界坐标 Yᴡ</text>
<line x1="350" y1="620" x2="568.7429987478853" y2="691.073908706238" stroke="#2F6BFF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="350" y1="620" x2="411.80339887498945" y2="429.78869674096927" stroke="#2F6BFF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="587.7641290737884" y="697.2542485937369" fill="#2F6BFF" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="start">xᴮ⁰（前）</text>
<text x="414.89356881873897" y="420.2781315780178" fill="#2F6BFF" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" font-style="normal" text-anchor="start">yᴮ⁰（左）</text>
<circle cx="350" cy="620" r="14" fill="#2F6BFF" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="3"/>
<text x="350" y="662" fill="#18232D" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="middle">起跳位置 p_takeoff</text>
<circle cx="760" cy="350" r="16" fill="#F28E2B" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="3"/>
<text x="774" y="325" fill="#F28E2B" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="middle">期望目标 p_target</text>
<circle cx="720" cy="385" r="14" fill="#2FA36B" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="3"/>
<text x="750" y="430" fill="#2FA36B" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="middle">实际落点 p_land</text>
<line x1="362" y1="608" x2="742" y2="362" stroke="#F28E2B" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="575" y="440" fill="#F28E2B" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle">目标命令 g</text>
<line x1="362" y1="616" x2="704" y2="397" stroke="#2FA36B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<text x="560" y="520" fill="#2FA36B" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" font-style="normal" text-anchor="middle">实际位移 Δp</text>
<line x1="720" y1="385" x2="760" y2="350" stroke="#D9544D" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="770" y="408" fill="#D9544D" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="start">误差 eₚ</text>
<path d="M 350 620 A 120 120 0 0 0 460 570" fill="none" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="6 5"/>
<text x="425" y="575" fill="#2F6BFF" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start">起跳时锁定航向</text>
<rect x="1040" y="100" width="515" height="720" rx="22" fill="#FFFFFF" fill-opacity="1.0" stroke="#183B56" stroke-width="2"/>
<text x="1297" y="155" fill="#183B56" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" font-style="normal" text-anchor="middle">命令语义</text>
<rect x="1090" y="195" width="415" height="108" rx="16" fill="#EAF1FF" fill-opacity="1.0" stroke="#2F6BFF" stroke-width="2"/>
<text x="1297" y="242" fill="#2F6BFF" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" font-style="normal" text-anchor="middle">g = (Δx*, Δy*)</text>
<text x="1297" y="278" fill="#607080" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" font-style="normal" text-anchor="middle">前后位移 + 左右位移</text>
<text x="1095" y="350" fill="#178C7B" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="start">坐标系</text>
<text x="1215" y="350" fill="#18232D" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start">起跳瞬间锁定的机体航向坐标系</text>
<line x1="1090" y1="375" x2="1505" y2="375" stroke="#DDE3EA" stroke-width="1" stroke-linecap="round"/>
<text x="1095" y="432" fill="#178C7B" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="start">更新时间</text>
<text x="1215" y="432" fill="#18232D" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start">触发起跳时锁存，恢复完成后释放</text>
<line x1="1090" y1="457" x2="1505" y2="457" stroke="#DDE3EA" stroke-width="1" stroke-linecap="round"/>
<text x="1095" y="514" fill="#178C7B" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="start">表达内容</text>
<text x="1215" y="514" fill="#18232D" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start">期望起落位置关系</text>
<line x1="1090" y1="539" x2="1505" y2="539" stroke="#DDE3EA" stroke-width="1" stroke-linecap="round"/>
<text x="1095" y="596" fill="#178C7B" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="start">不包含</text>
<text x="1215" y="596" fill="#18232D" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start">动作相位、未来姿态、足端轨迹</text>
<line x1="1090" y1="621" x2="1505" y2="621" stroke="#DDE3EA" stroke-width="1" stroke-linecap="round"/>
<text x="1095" y="678" fill="#178C7B" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="start">评价量</text>
<text x="1215" y="678" fill="#18232D" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start">eₚ = ‖Δp − g‖₂</text>
<rect x="1090" y="730" width="415" height="55" rx="12" fill="#FFF1E2" fill-opacity="1.0" stroke="#FFF1E2" stroke-width="0"/>
<text x="1297" y="765" fill="#F28E2B" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="650" font-style="normal" text-anchor="middle">“紧凑”仅指相对完整参考轨迹减少过程信息</text>
</svg>